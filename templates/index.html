<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance - Status Stabil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        #videoFeed { object-fit: cover; max-height: 480px; }
        .status-main {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .status-timer {
            font-size: 0.9rem;
            margin-top: 5px;
            color: #856404;
        }
        .alert-secondary .status-timer { color: #383d41; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                    <div class="card-body text-center">
                        <h3 class="card-title fw-bold text-primary mb-4">
                            <i class="bi bi-person-bounding-box me-2"></i>Sistem Absensi Wajah
                        </h3>

                        <div class="bg-light p-2 mb-2 ">
                            <img id="videoFeed" src="{{ url_for('main.video_feed') }}" alt="Video Feed" class="img-fluid rounded w-80">
                        </div>

                        <!-- Area status dengan dua baris -->
                        <div id="statusContainer" class="alert alert-secondary fw-semibold" role="alert">
                            <div id="statusMain" class="status-main">
                                <i class="bi bi-info-circle me-1"></i> Menunggu tindakan...
                            </div>
                            <div id="statusTimer" class="status-timer"></div>
                        </div>

                        <button id="scanBtn" class="btn btn-primary btn-lg w-100 rounded-pill mb-3 shadow-sm">
                            <i class="bi bi-camera me-2"></i>Scan Wajah
                        </button>

                        <div id="attendanceDiv" class="d-none mt-3">
                            <hr class="my-4">
                            <h5 class="text-muted mb-3">Pilih Aksi Kehadiran</h5>
                            <div class="d-grid gap-2">
                                <button id="masukBtn" class="btn btn-success btn-lg rounded-pill shadow-sm">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Absen Masuk
                                </button>
                                <button id="keluarBtn" class="btn btn-danger btn-lg rounded-pill shadow-sm">
                                    <i class="bi bi-box-arrow-left me-2"></i>Absen Keluar
                                </button>
                                <button id="riwayatBtn" class="btn btn-outline-primary btn-lg rounded-pill shadow-sm mt-2">
                                    <i class="bi bi-clock-history me-2"></i>Lihat Riwayat
                                </button>
                            </div>
                        </div>
                    </div>
            </div>
        </div>
    </div>

    <!-- Modal Riwayat -->
    <div class="modal fade" id="riwayatModal" tabindex="-1" aria-labelledby="riwayatModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title fw-bold"><i class="bi bi-card-list me-2"></i>Riwayat Absen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="riwayatList"></div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        const scanBtn = document.getElementById('scanBtn');
        const statusMainDiv = document.getElementById('statusMain');
        const statusTimerDiv = document.getElementById('statusTimer');
        const statusContainer = document.getElementById('statusContainer');
        const attendanceDiv = document.getElementById('attendanceDiv');
        const riwayatModal = new bootstrap.Modal(document.getElementById('riwayatModal'));
        
        let currentUserId = null;

        // Fungsi untuk mengubah warna alert dan teks utama
        function setStatus(mainHtml, type = 'secondary', timerHtml = '') {
            // Hapus kelas alert sebelumnya
            statusContainer.classList.remove('alert-secondary', 'alert-primary', 'alert-success', 'alert-danger', 'alert-warning', 'alert-info');
            statusContainer.classList.add(`alert-${type}`);
            statusMainDiv.innerHTML = mainHtml;
            statusTimerDiv.innerHTML = timerHtml;
        }

        // Event Source
        const eventSource = new EventSource("{{ url_for('main.status_stream') }}");
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("Status:", data);

            switch(data.status) {
                case "VERIFIED":
                    setStatus(`<i class="bi bi-check-circle-fill me-1"></i> ${data.message}`, 'success', '');
                    currentUserId = data.user_id;
                    attendanceDiv.classList.remove("d-none");
                    scanBtn.disabled = true;
                    break;
                case "IDLE":
                    setStatus(`<i class="bi bi-info-circle me-1"></i> ${data.message || 'Menunggu tindakan...'}`, 'secondary', '');
                    attendanceDiv.classList.add("d-none");
                    scanBtn.disabled = false;
                    currentUserId = null;
                    break;
                case "FAILED":
                case "ERROR":
                    setStatus(`<i class="bi bi-x-circle-fill me-1"></i> ${data.message}`, 'danger', '');
                    scanBtn.disabled = false;
                    break;
                case "RECOGNIZE_START":
                    setStatus(`<i class="bi bi-arrow-repeat me-1 spinner-border spinner-border-sm"></i> ${data.message}`, 'primary', '');
                    break;
                case "PREPARE_LIVENESS":
                    setStatus(`<i class="bi bi-eye me-1"></i> ${data.message}`, 'info', '');
                    break;
                case "LIVENESS_START":
                    setStatus(`<i class="bi bi-arrow-repeat me-1"></i> ${data.message}`, 'primary', '');
                    break;
                case "LIVENESS_PROGRESS":
                    setStatus(`<i class="bi bi-play-circle me-1"></i> ${data.message}`, 'primary', '');
                    break;
                case "LIVENESS_COUNTDOWN":
                    // Hanya update timer, tidak mengubah teks utama
                    statusTimerDiv.innerHTML = `<i class="bi bi-hourglass-split me-1"></i> ${data.message}`;
                    break;
                case "BLINK_DETECTED":
                    // Update teks utama dengan jumlah kedip, timer tetap di bawah
                    setStatus(`<i class="bi bi-check-lg me-1"></i> ${data.message}`, 'success', statusTimerDiv.innerHTML);
                    break;
                default:
                    setStatus(`<i class="bi bi-hourglass-split me-1"></i> ${data.message || data.status}`, 'warning', '');
            }
        };

        scanBtn.onclick = async function() {
            scanBtn.disabled = true;
            setStatus('<i class="bi bi-arrow-repeat me-1 spinner-border spinner-border-sm"></i> Memulai scan...', 'primary', '');
            try {
                const response = await fetch("{{ url_for('main.start_scan') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });
                if (!response.ok) {
                    setStatus('<i class="bi bi-exclamation-triangle-fill me-1"></i> Gagal memulai scan', 'danger', '');
                    scanBtn.disabled = false;
                }
            } catch (error) {
                setStatus('<i class="bi bi-exclamation-triangle-fill me-1"></i> Kesalahan jaringan', 'danger', '');
                scanBtn.disabled = false;
            }
        };

        async function sendAttendance(type) {
            if (!currentUserId) return;
            const btn = type === 'masuk' ? document.getElementById('masukBtn') : document.getElementById('keluarBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';
            btn.disabled = true;

            let lat = null, lon = null;
            if (navigator.geolocation) {
                const pos = await new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(resolve, () => resolve(null));
                });
                if (pos) { lat = pos.coords.latitude; lon = pos.coords.longitude; }
            }

            try {
                const response = await fetch("{{ url_for('main.log_attendance') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: currentUserId, attendance_type: type, latitude: lat, longitude: lon })
                });
                const result = await response.json();
                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: `Absen ${type} tercatat.`, showConfirmButton: false, timer: 2000 });
                    await fetch("{{ url_for('main.reset_state') }}", { method: "POST" });
                    attendanceDiv.classList.add("d-none");
                    scanBtn.disabled = false;
                    currentUserId = null;
                    setStatus('<i class="bi bi-info-circle me-1"></i> Menunggu tindakan...', 'secondary', '');
                } else {
                    Swal.fire({ icon: 'error', title: 'Gagal Absen', text: result.error });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Kesalahan Server', text: 'Tidak dapat terhubung ke server.' });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.getElementById('masukBtn').onclick = () => sendAttendance('masuk');
        document.getElementById('keluarBtn').onclick = () => sendAttendance('keluar');

        async function showHistory() {
            if (!currentUserId) return;
            const btn = document.getElementById('riwayatBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memuat...';
            btn.disabled = true;
            try {
                const response = await fetch(`/attendance_history/${currentUserId}`);
                const data = await response.json();
                if (data.success) {
                    const listDiv = document.getElementById('riwayatList');
                    listDiv.innerHTML = '';
                    if (data.history.length === 0) {
                        listDiv.innerHTML = '<div class="p-4 text-center text-muted">Belum ada riwayat.</div>';
                    } else {
                        const ul = document.createElement('ul');
                        ul.className = 'list-group list-group-flush';
                        data.history.forEach(item => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item d-flex justify-content-between';
                            const badgeColor = item.type === 'masuk' ? 'bg-success' : 'bg-danger';
                            li.innerHTML = `<span>${item.timestamp}</span><span class="badge ${badgeColor}">${item.type.toUpperCase()}</span>`;
                            ul.appendChild(li);
                        });
                        listDiv.appendChild(ul);
                    }
                    riwayatModal.show();
                } else {
                    Swal.fire({ icon: 'warning', title: 'Gagal', text: 'Tidak bisa mengambil riwayat.' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Koneksi bermasalah.' });
            } finally {
                btn.innerHTML = '<i class="bi bi-clock-history me-2"></i>Lihat Riwayat';
                btn.disabled = false;
            }
        }
        document.getElementById('riwayatBtn').onclick = showHistory;
    </script>
</body>
</html>
